[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rapidgrab"
version = "0.1.0"
description = "Rapid Grab - a fast, IDM-style video and audio downloader"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rapid Grab" }]
dependencies = [
    "PySide6>=6.7",
    "yt-dlp>=2024.12.23",
    "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.10",
    "pillow>=10.0",
]

[project.scripts]
rapidgrab = "rapidgrab.main:main"

[tool.setuptools.packages.find]
include = ["rapidgrab*"]

[tool.setuptools.package-data]
rapidgrab = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
